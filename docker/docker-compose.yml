services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: healthchecks1mg_x86:latest
    env_file:
      - .env.example
    command: [ "uwsgi", "/opt/healthchecks/docker/uwsgi.ini" ]
    ports:
      - "8000:8000"
      # To enable SMTP on port 2525, set SMTPD_PORT=2525 in .env
      # and uncomment the following line:
      # - "2525:2525"
